<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 960 860" width="100%" height="100%">
  <title>Tech Stack Center Orbit - Cyber Theme</title>
  
  <defs>
    <!-- Dark Cyber Radial Background -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#061C0E"/>
      <stop offset="55%" stop-color="#020B05"/>
      <stop offset="100%" stop-color="#000402"/>
    </radialGradient>

    <!-- Neon Glow Effect -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="centerShieldGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Base Cyber Circle Holder for Custom Badges -->
    <g id="cyber-base">
      <circle cx="0" cy="0" r="22" fill="#061A0C" stroke="#00FF41" stroke-width="1.2" filter="url(#neonGlow)"/>
      <circle cx="0" cy="0" r="19" fill="#0A2212"/>
    </g>

    <!-- CUSTOM EXTRA ICONS -->
    <g id="icon-sfml">
      <circle cx="0" cy="0" r="18" fill="#1E1E1E"/>
      <path d="M-8,-6 L-2,-6 L-2,0 L-8,0 Z" fill="#8CC63F"/>
      <path d="M2,-6 L8,-6 L8,6 L2,6 Z" fill="#8CC63F"/>
      <path d="M-8,2 L-2,2 L-2,6 L-8,6 Z" fill="#00A896"/>
    </g>

    <g id="icon-minio">
      <circle cx="0" cy="0" r="18" fill="#C72C48"/>
      <path d="M-8,5 L-8,-5 L-2,-1 L-2,5 Z M0,5 L0,-1 L6,-5 L6,5 Z" fill="#FFFFFF"/>
    </g>

    <g id="icon-burp">
      <circle cx="0" cy="0" r="18" fill="#FF6600"/>
      <path d="M-3,-9 L4,-9 L1,0 L6,0 L-3,9 L-1,2 L-5,2 Z" fill="#FFFFFF"/>
    </g>

    <g id="icon-wireshark">
      <circle cx="0" cy="0" r="18" fill="#1679A7"/>
      <path d="M-10,6 C-2,6 0,-6 9,-6 C3,-1 0,8 -10,6 Z" fill="#FFFFFF"/>
    </g>

    <g id="icon-thm">
      <circle cx="0" cy="0" r="18" fill="#111827"/>
      <path d="M-8,-5 L8,-5 L0,8 Z" fill="#22C55E"/>
      <text x="0" y="-1" fill="#FFFFFF" font-family="sans-serif" font-weight="bold" font-size="6" text-anchor="middle">THM</text>
    </g>

    <g id="icon-gns3">
      <circle cx="0" cy="0" r="18" fill="#000000"/>
      <path d="M-6,-2 C-6,-6 6,-6 6,-2 C6,3 0,1 0,7" fill="none" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
      <circle cx="0" cy="-2" r="1.5" fill="#FFFFFF"/>
    </g>

    <g id="icon-packettracer">
      <circle cx="0" cy="0" r="18" fill="#0B192C"/>
      <circle cx="-5" cy="4" r="2.2" fill="#049FD9"/>
      <circle cx="5" cy="4" r="2.2" fill="#049FD9"/>
      <circle cx="0" cy="-4" r="2.2" fill="#049FD9"/>
      <line x1="-5" y1="4" x2="0" y2="-4" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="5" y1="4" x2="0" y2="-4" stroke="#FFFFFF" stroke-width="1.2"/>
      <line x1="-5" y1="4" x2="5" y2="4" stroke="#FFFFFF" stroke-width="1.2"/>
    </g>

    <g id="icon-devcpp">
      <circle cx="0" cy="0" r="18" fill="#00599C"/>
      <rect x="-9" y="-6" width="18" height="12" rx="1.5" fill="#1E293B"/>
      <text x="0" y="3" fill="#61DAFB" font-family="sans-serif" font-weight="bold" font-size="7.5" text-anchor="middle">DEV</text>
    </g>
  </defs>

  <style>
    /* Styling &amp; Animation Rules */
    .bg-line { stroke: #00FF41; stroke-opacity: 0.15; stroke-dasharray: 4, 4; fill: none; }
    .center-cross { stroke: #00FF41; stroke-opacity: 0.35; stroke-width: 1; stroke-dasharray: 6, 6; }
    .orbit-circle { fill: none; stroke: #00FF41; stroke-opacity: 0.25; stroke-width: 1.2; }
    .orbit-circle-outer { fill: none; stroke: #00FF41; stroke-opacity: 0.18; stroke-width: 1.2; stroke-dasharray: 8, 6; }
    
    .shield-bg { fill: #021407; stroke: #00FF41; stroke-width: 2.2; filter: url(#centerShieldGlow); }
    .cyber-title { font-family: 'Courier New', Courier, monospace; fill: #00FF41; font-weight: bold; letter-spacing: 2px; }

    /* Keyframes for Continuous Orbiting around Center (480, 430) */
    @keyframes rotateCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes rotateCCW {
      from { transform: rotate(360deg); }
      to { transform: rotate(0deg); }
    }

    /* Counter-rotation so icons remain upright while orbiting */
    @keyframes counterRotateCW {
      from { transform: rotate(0deg); }
      to { transform: rotate(-360deg); }
    }
    @keyframes counterRotateCCW {
      from { transform: rotate(-360deg); }
      to { transform: rotate(0deg); }
    }

    /* Assigning rotation to Orbit Groups around Center (480px, 430px) */
    .ring-1 { transform-origin: 480px 430px; animation: rotateCW 25s linear infinite; }
    .ring-2 { transform-origin: 480px 430px; animation: rotateCCW 25s linear infinite; }
    .ring-3 { transform-origin: 480px 430px; animation: rotateCW 25s linear infinite; }
    .ring-4 { transform-origin: 480px 430px; animation: rotateCCW 25s linear infinite; }

    .ring-1 .node { transform-origin: center; animation: counterRotateCW 25s linear infinite; }
    .ring-2 .node { transform-origin: center; animation: counterRotateCCW 25s linear infinite; }
    .ring-3 .node { transform-origin: center; animation: counterRotateCW 25s linear infinite; }
    .ring-4 .node { transform-origin: center; animation: counterRotateCCW 25s linear infinite; }
  </style>

  <!-- Background -->
  <rect width="100%" height="100%" fill="url(#bgGlow)"/>

  <!-- Center Diagonal Grid (Intersecting at 480, 430) -->
  <g id="center-diagonals">
    <line x1="0" y1="0" x2="960" y2="860" class="center-cross"/>
    <line x1="0" y1="860" x2="960" y2="0" class="center-cross"/>
    <line x1="480" y1="0" x2="480" y2="860" class="bg-line"/>
    <line x1="0" y1="430" x2="960" y2="430" class="bg-line"/>
  </g>

  <!-- Orbit Path Visual Circles centered at (480, 430) -->
  <g id="orbit-paths">
    <circle cx="480" cy="430" r="130" class="orbit-circle"/>
    <circle cx="480" cy="430" r="220" class="orbit-circle"/>
    <circle cx="480" cy="430" r="310" class="orbit-circle"/>
    <circle cx="480" cy="430" r="395" class="orbit-circle-outer"/>
  </g>

  <!-- CENTER CORE (Giao điểm 2 đường chéo: x=480, y=430) -->
  <g id="center-core" transform="translate(480, 430)">
    <circle cx="0" cy="0" r="75" fill="#00FF41" opacity="0.06" filter="url(#centerShieldGlow)"/>
    <circle cx="0" cy="0" r="55" fill="none" stroke="#00FF41" stroke-width="1.2" stroke-dasharray="5,4" opacity="0.5"/>
    
    <!-- Central Security Shield -->
    <path d="M0,-28 L20,-17 L20,6 C20,19 0,30 0,30 C0,30 -20,19 -20,6 L-20,-17 Z" class="shield-bg"/>
    <rect x="-7" y="-2" width="14" height="11" rx="2" fill="#00FF41"/>
    <path d="M-4,-2 L-4,-7 C-4,-10 4,-10 4,-7 L4,-2" fill="none" stroke="#00FF41" stroke-width="2"/>
    
    <text x="0" y="48" class="cyber-title" font-size="11" text-anchor="middle">TECH STACK</text>
    <text x="0" y="62" fill="#00FF41" opacity="0.7" font-family="'Courier New', monospace" font-size="8.5" text-anchor="middle">CENTER ORBIT</text>
  </g>

  <!-- ORBIT 1: 10 Core Languages (Radius: 130px around 480,430) -->
  <g class="ring-1">
    <g transform="translate(610, 430)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=cpp" href="https://skillicons.dev/icons?i=cpp" x="-18" y="-18" width="36" height="36"/></g></g>
    <g transform="translate(585, 506)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=java" href="https://skillicons.dev/icons?i=java" x="-18" y="-18" width="36" height="36"/></g></g>
    <g transform="translate(520, 553)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=py" href="https://skillicons.dev/icons?i=py" x="-18" y="-18" width="36" height="36"/></g></g>
    <g transform="translate(440, 553)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=js" href="https://skillicons.dev/icons?i=js" x="-18" y="-18" width="36" height="36"/></g></g>
    <g transform="translate(375, 506)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=ts" href="https://skillicons.dev/icons?i=ts" x="-18" y="-18" width="36" height="36"/></g></g>
    <g transform="translate(350, 430)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=kt" href="https://skillicons.dev/icons?i=kt" x="-18" y="-18" width="36" height="36"/></g></g>
    <g transform="translate(375, 354)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=lua" href="https://skillicons.dev/icons?i=lua" x="-18" y="-18" width="36" height="36"/></g></g>
    <g transform="translate(440, 307)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=cs" href="https://skillicons.dev/icons?i=cs" x="-18" y="-18" width="36" height="36"/></g></g>
    <g transform="translate(520, 307)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=html" href="https://skillicons.dev/icons?i=html" x="-18" y="-18" width="36" height="36"/></g></g>
    <g transform="translate(585, 354)"><g class="node"><image xlink:href="https://skillicons.dev/icons?i=css" href="https://skillicons.dev/icons?i=css" x="-18" y="-18" width="36" height="36"/></g></g>
  </g>

